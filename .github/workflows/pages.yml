name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate public commercial surface
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'Prime Origami|zjzjzjzjzjzj-code\.github\.io|YOUR-AMAZON-TAG|Commercial link temporarily paused' --include='*.html' --include='*.js' .; then
            echo 'Legacy brand, URL, placeholder, or paused-commercial copy detected.' >&2
            exit 1
          fi
          if grep -R -n -E '@gmail\.com' --include='*.html' . | grep -v -F 'serpentcianide@gmail.com' | grep -q .; then
            echo 'Unapproved Gmail address detected in public HTML.' >&2
            exit 1
          fi
          grep -q '"commercializationEnabled":true' config.js
          grep -q '"associateTag":"foldflightlab-21"' config.js
          grep -q "rel='sponsored nofollow noopener'" app.js
          for f in index.html products.html affiliate-disclosure.html origami-paper.html paper-airplanes.html origami-books.html; do grep -q "Als Amazon-Partner verdiene ich an qualifizierten Verkäufen." "$f"; done
          test -f sitemap.xml
          test -f sitemap.txt
          test -f community-questions.html
          test -f community.css
          test -f diagnostic.js
          test -f diagnostic.css
          test -f subscription.js
          test -f business.css
          test -f paper-airplane-troubleshooting.html
          test -f join.html
          node --check app.js
          node --check diagnostic.js
          node --check subscription.js
          grep -q 'data-flight-lab' diagnostic.js
          grep -q "diagnosticStyles.href='/diagnostic.css'" app.js
          grep -q "script.src='/diagnostic.js'" app.js
          grep -q "aria-live=\"polite\"" diagnostic.js
          grep -q '<loc>https://foldflightlab.github.io/</loc>' sitemap.xml
          for f in origami-paper.html paper-airplanes.html origami-books.html community-questions.html paper-airplane-troubleshooting.html join.html; do grep -q "https://foldflightlab.github.io/$f" sitemap.xml; done
          grep -q 'https://foldflightlab.github.io/community-questions.html' sitemap.txt
          grep -q 'User-agent: OAI-SearchBot' robots.txt
          grep -q 'FAQPage' community-questions.html
          grep -q 'FAQPage' paper-airplane-troubleshooting.html
          grep -q 'data-subscribe-form' join.html
          grep -q '"consentVersion":"2026-08-17"' config.js
          if grep -q 'kein Newsletter-System' privacy.html; then echo 'Outdated newsletter privacy copy detected.' >&2; exit 1; fi
          if grep -qE 'PrimeOrigamy|zjzjzjzjzjzj-code' sitemap.xml sitemap.txt robots.txt; then echo 'Legacy production URL detected in SEO files.' >&2; exit 1; fi
          python3 scripts/validate_site.py

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
