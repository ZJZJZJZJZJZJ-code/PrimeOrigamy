name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate public commercial surface
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'Prime Origami|zjzjzjzjzjzj-code\.github\.io|YOUR-AMAZON-TAG|Commercial link temporarily paused' --include='*.html' --include='*.js' .; then
            echo 'Legacy brand, URL, placeholder, or paused-commercial copy detected.' >&2
            exit 1
          fi
          if grep -R -n -E '@gmail\.com' --include='*.html' . | grep -v -F 'serpentcianide@gmail.com' | grep -q .; then
            echo 'Unapproved Gmail address detected in public HTML.' >&2
            exit 1
          fi
          grep -q '"commercializationEnabled":true' config.js
          grep -q '"associateTag":"foldflightlab-21"' config.js
          grep -q "rel='sponsored nofollow noopener'" app.js
          for f in index.html products.html affiliate-disclosure.html origami-paper.html paper-airplanes.html origami-books.html; do grep -q "Als Amazon-Partner verdiene ich an qualifizierten Verkäufen." "$f"; done
          test -f sitemap.xml
          test -f sitemap.txt
          test -f community-questions.html
          test -f community.css
          test -f diagnostic.js
          test -f diagnostic.css
          node --check app.js
          node --check diagnostic.js
          grep -q 'data-flight-lab' diagnostic.js
          grep -q "ensureStylesheet('/diagnostic.css')" app.js
          grep -q "script.src='/diagnostic.js'" app.js
          grep -q '<loc>https://foldflightlab.github.io/</loc>' sitemap.xml
          for f in origami-paper.html paper-airplanes.html origami-books.html community-questions.html; do grep -q "https://foldflightlab.github.io/$f" sitemap.xml; done
          grep -q 'https://foldflightlab.github.io/community-questions.html' sitemap.txt
          grep -q 'User-agent: OAI-SearchBot' robots.txt
          grep -q 'FAQPage' community-questions.html
          if grep -qE 'PrimeOrigamy|zjzjzjzjzjzj-code' sitemap.xml sitemap.txt robots.txt; then echo 'Legacy production URL detected in SEO files.' >&2; exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          root=Path('.').resolve(); exempt={'404.html','imprint.html','privacy.html','affiliate-disclosure.html'}
          raw=Path('config.js').read_text(encoding='utf-8')
          payload=raw.split('=',1)[1].strip().rstrip(';')
          cfg=json.loads(payload)
          assert cfg.get('commercializationEnabled') is True
          assert cfg.get('associateTag')=='foldflightlab-21'
          links=cfg.get('links',{})
          for key,item in links.items():
              assert item.get('type') in {'search','direct'}, f'{key}: invalid link type'
              if item['type']=='direct': assert re.fullmatch(r'[A-Z0-9]{10}',item.get('asin',''),re.I), f'{key}: invalid ASIN'
              else: assert item.get('query','').strip(), f'{key}: empty search query'
          used=set()
          for path in root.rglob('*.html'):
              text=path.read_text(encoding='utf-8'); rel=path.relative_to(root).as_posix()
              used.update(re.findall(r'data-amazon="([^"]+)"',text))
              if rel not in exempt:
                  for required,label in [(r'<title>[^<]+</title>','title'),(r'<meta name="description" content="[^"]+"','meta description'),(r'<link rel="canonical" href="https://foldflightlab\.github\.io/[^"]*"','canonical')]:
                      if not re.search(required,text,re.I): raise SystemExit(f'{rel}: missing {label}')
              for href in re.findall(r'href="([^"]+)"',text):
                  if href.startswith(('#','http://','https://','mailto:','tel:','javascript:')): continue
                  clean=href.split('#',1)[0].split('?',1)[0]
                  if not clean: continue
                  target=(root/clean.lstrip('/')) if clean.startswith('/') else (path.parent/clean).resolve()
                  if clean.endswith('/') or target.is_dir(): target=target/'index.html'
                  if not target.exists(): raise SystemExit(f'{rel}: broken internal link -> {href}')
          missing=sorted(used-set(links))
          if missing: raise SystemExit('Missing Amazon config keys: '+', '.join(missing))
          required_direct={'bookEasy','bookAbsolute','bookOneFold','bookEncyclopedia','bookDesignSecrets','bookChampion','bookSmithsonian'}
          if not required_direct.issubset(used): raise SystemExit('Some curated books are not linked in HTML')
          print(f'HTML/SEO/internal-link/Amazon-key validation passed. {len(used)} affiliate intents checked.')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
